spring:
  application:
    name: ledgerguard-api
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/ledgerguard}
    username: ${POSTGRES_USER:ledgerguard}
    password: ${POSTGRES_PASSWORD:ledgerguard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

ledgerguard:
  auth:
    username: ${DEMO_USERNAME:demo}
    password: ${DEMO_PASSWORD:ledgerguard}
  jwt:
    secret: ${JWT_SECRET:bGVkZ2VyZ3VhcmQtbG9jYWwtZGVtby1zZWNyZXQta2V5LTIwMjYtMDE=}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
  api-docs:
    path: /api-docs
